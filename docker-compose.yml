services:
  minio-gateway:
    image: minio-app:latest
    container_name: minio-gateway
    ports:
      - "4950:4950"
    env_file:
      - .env
    restart: always
    networks:
      - minio_gateway_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${ASSETS_IP}:${DB_HOST}"

networks:
  minio_gateway_network:
    driver: bridge
