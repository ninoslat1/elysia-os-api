name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    if: github.repository_owner == 'pt-sap'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t minio-app:latest .
          docker save minio-app:latest -o minio-app.tar

      - name: Create .env file from secrets
        run: |
          cat > .env << EOF
          BUCKET_NAME=${{ secrets.BUCKET_NAME }}
          BUCKET_USERNAME=${{ secrets.BUCKET_USERNAME }}
          BUCKET_PASSWORD=${{ secrets.BUCKET_PASSWORD }}
          BUCKET_URL=${{ secrets.BUCKET_URL }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASS=${{ secrets.DB_PASS }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_MST=${{ secrets.DB_MST }}
          JWT_DISPLAY_KEY=${{ secrets.JWT_DISPLAY_KEY }}
          JWT_ISS=${{ secrets.JWT_ISS }}
          JWT_AUD=${{ secrets.JWT_AUD }}
          APP_PORT=${{ secrets.APP_PORT }}
          ASSETS_IP=${{ secrets.ASSETS_IP }}
          EOF

      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEYS }}
          source: "minio-app.tar,docker-compose.yml,.env"
          target: "/tmp/minio_app_deploy"

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEYS }}
          script: |
            docker load < /tmp/minio_app_deploy/minio-app.tar

            mkdir -p ~/sap/minio-app
            mv /tmp/minio_app_deploy/docker-compose.yml ~/sap/minio-app/
            mv /tmp/minio_app_deploy/.env ~/sap/minio-app/
            cd ~/sap/minio-app

            docker compose down
            docker compose up -d

            rm -rf /tmp/minio_app_deploy
